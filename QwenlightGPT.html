<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyCamp — Интерактивный курс Python</title>
<style>
  :root {
    --bg-primary: #0a0a23;
    --bg-secondary: #1b1b32;
    --bg-tertiary: #2a2a40;
    --bg-editor: #1e1e2e;
    --text-primary: #f5f6f7;
    --text-secondary: #d0d0d5;
    --text-muted: #858591;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --success: #22c55e;
    --success-bg: #052e16;
    --error: #ef4444;
    --error-bg: #2d0a0a;
    --warning: #f59e0b;
    --warning-bg: #2d2006;
    --border: #3b3b4f;
    --line-num: #555570;
    --scrollbar: #3b3b4f;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 8px;
    --transition: 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-sans);
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-secondary); }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ─── HEADER ─── */
  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(10px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-primary);
    text-decoration: none;
  }

  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }

  .logo span { color: var(--accent); }

  .header-stats {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  .header-stats .streak {
    color: var(--warning);
    font-weight: 600;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-container {
    background: var(--bg-secondary);
    padding: 0 24px 12px;
    border-bottom: 1px solid var(--border);
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--bg-tertiary);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #8b5cf6);
    border-radius: 3px;
    transition: width 0.5s ease;
    width: 0%;
  }

  /* ─── LOADING SCREEN ─── */
  .loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s ease;
  }

  .loading-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-spinner {
    width: 60px; height: 60px;
    border: 4px solid var(--bg-tertiary);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-size: 1.1rem;
    color: var(--text-secondary);
  }

  .loading-sub {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  /* ─── MAIN LAYOUT ─── */
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: calc(100vh - 90px);
  }

  /* ─── LEFT PANEL (Instructions) ─── */
  .panel-left {
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    max-height: calc(100vh - 90px);
    position: sticky;
    top: 90px;
  }

  .task-header {
    padding: 24px 28px 0;
  }

  .task-number {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }

  .task-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.3;
  }

  .task-description {
    padding: 0 28px;
    color: var(--text-secondary);
    font-size: 0.95rem;
    line-height: 1.7;
  }

  .task-description p { margin-bottom: 12px; }

  .task-description code {
    background: var(--bg-tertiary);
    padding: 2px 7px;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.88em;
    color: #c084fc;
  }

  .task-description pre {
    background: var(--bg-editor);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin: 12px 0;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.6;
    color: #e2e8f0;
  }

  .task-description ul, .task-description ol {
    margin: 8px 0 12px 20px;
  }

  .task-description li { margin-bottom: 4px; }

  .task-description .expected {
    background: var(--success-bg);
    border: 1px solid #166534;
    border-radius: var(--radius);
    padding: 12px 16px;
    margin: 12px 0;
    font-family: var(--font-mono);
    font-size: 0.85rem;
  }

  .task-description .expected-label {
    color: var(--success);
    font-weight: 700;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
    font-family: var(--font-sans);
  }

  /* ─── RIGHT PANEL (Editor) ─── */
  .panel-right {
    display: flex;
    flex-direction: column;
    background: var(--bg-primary);
    max-height: calc(100vh - 90px);
    position: sticky;
    top: 90px;
  }

  .editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--bg-tertiary);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .editor-toolbar .file-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    color: var(--text-secondary);
    background: var(--bg-editor);
    padding: 5px 14px;
    border-radius: 6px 6px 0 0;
    border: 1px solid var(--border);
    border-bottom-color: var(--bg-editor);
  }

  .file-tab .dot { color: #f59e0b; }

  .editor-actions {
    display: flex;
    gap: 8px;
  }

  .btn-reset {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 12px;
    border-radius: 5px;
    font-size: 0.78rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-reset:hover {
    border-color: var(--error);
    color: var(--error);
  }

  .editor-wrapper {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
  }

  .line-numbers {
    background: var(--bg-editor);
    padding: 16px 0;
    text-align: right;
    user-select: none;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.65;
    color: var(--line-num);
    min-width: 44px;
    padding-right: 12px;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }

  .line-numbers div {
    padding-right: 4px;
  }

  .code-editor {
    flex: 1;
    background: var(--bg-editor);
    color: #e2e8f0;
    border: none;
    outline: none;
    resize: none;
    padding: 16px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.65;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
  }

  .code-editor::placeholder {
    color: var(--text-muted);
  }

  /* ─── BOTTOM SECTION ─── */
  .bottom-section {
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .action-bar {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg-secondary);
    align-items: center;
  }

  .btn-run {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-run:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-run:active { transform: translateY(0); }
  .btn-run:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-run .spinner {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  .btn-run.loading .spinner { display: block; }
  .btn-run.loading .btn-text { display: none; }

  .nav-buttons {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  .btn-nav {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: var(--transition);
  }

  .btn-nav:hover { border-color: var(--accent); color: var(--accent); }
  .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ─── OUTPUT / RESULT ─── */
  .output-panel {
    background: var(--bg-primary);
    max-height: 200px;
    overflow-y: auto;
    display: none;
  }

  .output-panel.visible { display: block; }

  .output-header {
    padding: 8px 16px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    position: sticky;
    top: 0;
  }

  .output-content {
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 0.83rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .output-content.success { color: var(--success); }
  .output-content.error { color: var(--error); }
  .output-content.info { color: var(--text-secondary); }

  .result-banner {
    padding: 14px 16px;
    display: none;
    align-items: flex-start;
    gap: 10px;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .result-banner.visible { display: flex; }

  .result-banner.success {
    background: var(--success-bg);
    border-top: 2px solid var(--success);
    color: var(--success);
  }

  .result-banner.error {
    background: var(--error-bg);
    border-top: 2px solid var(--error);
    color: var(--error);
  }

  .result-banner.warning {
    background: var(--warning-bg);
    border-top: 2px solid var(--warning);
    color: var(--warning);
  }

  .result-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
  .result-text { flex: 1; }
  .result-text strong { display: block; margin-bottom: 2px; }
  .result-text .hint {
    color: var(--text-secondary);
    font-size: 0.83rem;
    margin-top: 6px;
  }

  /* ─── TASK LIST SIDEBAR (mobile toggle) ─── */
  .task-list-toggle {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 50px; height: 50px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 200;
    box-shadow: 0 4px 20px rgba(59,130,246,0.4);
  }

  .task-list-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 150;
  }

  .task-list-panel {
    position: fixed;
    top: 0;
    left: -320px;
    width: 300px;
    height: 100%;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    z-index: 160;
    transition: left 0.3s ease;
    overflow-y: auto;
    padding: 20px 0;
  }

  .task-list-panel.open { left: 0; }

  .task-list-panel h3 {
    padding: 0 20px 16px;
    font-size: 1rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .task-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    cursor: pointer;
    transition: var(--transition);
    font-size: 0.85rem;
    color: var(--text-secondary);
  }

  .task-list-item:hover { background: var(--bg-tertiary); }
  .task-list-item.active { background: var(--bg-tertiary); color: var(--accent); font-weight: 600; }
  .task-list-item.completed .task-check { color: var(--success); }

  .task-check {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    flex-shrink: 0;
  }

  .task-list-item.completed .task-check {
    border-color: var(--success);
    background: var(--success);
    color: white;
  }

  /* ─── COMPLETION MODAL ─── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.visible { display: flex; }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    text-align: center;
    max-width: 440px;
    width: 90%;
    animation: modalIn 0.3s ease;
  }

  @keyframes modalIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal .trophy { font-size: 4rem; margin-bottom: 16px; }
  .modal h2 { font-size: 1.5rem; margin-bottom: 8px; }
  .modal p { color: var(--text-secondary); margin-bottom: 24px; }

  .modal .btn-run {
    margin: 0 auto;
    padding: 12px 32px;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 900px) {
    .main-layout {
      grid-template-columns: 1fr;
    }

    .panel-left {
      position: relative;
      top: 0;
      max-height: none;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }

    .panel-right {
      position: relative;
      top: 0;
      max-height: none;
      min-height: 60vh;
    }

    .task-list-toggle { display: flex; align-items: center; justify-content: center; }

    .header-stats { display: none; }
  }

  @media (max-width: 500px) {
    .header { padding: 10px 14px; }
    .logo { font-size: 1.1rem; }
    .task-header { padding: 16px 16px 0; }
    .task-description { padding: 0 16px; }
    .task-title { font-size: 1.2rem; }
    .action-bar { flex-wrap: wrap; }
    .nav-buttons { margin-left: 0; width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Загрузка Python-движка...</div>
  <div class="loading-sub" id="loadingStatus">Инициализация Pyodide</div>
</div>

<!-- Header -->
<header class="header">
  <a class="logo" href="#">
    <div class="logo-icon">🐍</div>
    Py<span>Camp</span>
  </a>
  <div class="header-stats">
    <span>🏆 Решено: <strong id="solvedCount">0</strong> / <strong id="totalCount">15</strong></span>
  </div>
</header>

<!-- Progress -->
<div class="progress-container">
  <div class="progress-info">
    <span id="progressLabel">Задача 1 из 15</span>
    <span id="progressPercent">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- Main -->
<div class="main-layout">
  <!-- Left: Instructions -->
  <div class="panel-left" id="panelLeft">
    <div class="task-header">
      <div class="task-number" id="taskNumber">ЗАДАЧА 1 ИЗ 15</div>
      <h1 class="task-title" id="taskTitle">Загрузка...</h1>
    </div>
    <div class="task-description" id="taskDescription"></div>
  </div>

  <!-- Right: Editor -->
  <div class="panel-right">
    <div class="editor-toolbar">
      <div class="file-tab"><span class="dot">●</span> main.py</div>
      <div class="editor-actions">
        <button class="btn-reset" onclick="resetCode()" title="Сбросить код">↺ Сбросить</button>
      </div>
    </div>
    <div class="editor-wrapper">
      <div class="line-numbers" id="lineNumbers"><div>1</div></div>
      <textarea class="code-editor" id="codeEditor" spellcheck="false" placeholder="# Напишите ваш код здесь..."></textarea>
    </div>
    <div class="bottom-section">
      <div class="result-banner" id="resultBanner">
        <span class="result-icon" id="resultIcon"></span>
        <div class="result-text" id="resultText"></div>
      </div>
      <div class="output-panel" id="outputPanel">
        <div class="output-header">Вывод консоли</div>
        <div class="output-content" id="outputContent"></div>
      </div>
      <div class="action-bar">
        <button class="btn-run" id="btnRun" onclick="runCode()">
          <span class="spinner"></span>
          <span class="btn-text">▶ Проверить</span>
        </button>
        <div class="nav-buttons">
          <button class="btn-nav" id="btnPrev" onclick="prevTask()">← Назад</button>
          <button class="btn-nav" id="btnNext" onclick="nextTask()">Далее →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile task list -->
<button class="task-list-toggle" id="taskListToggle" onclick="toggleTaskList()">☰</button>
<div class="task-list-overlay" id="taskListOverlay" onclick="toggleTaskList()"></div>
<div class="task-list-panel" id="taskListPanel">
  <h3>📋 Все задачи</h3>
  <div id="taskListItems"></div>
</div>

<!-- Completion Modal -->
<div class="modal-overlay" id="completionModal">
  <div class="modal">
    <div class="trophy">🎉</div>
    <h2>Курс завершён!</h2>
    <p>Вы решили все 15 задач и освоили основы Python. Отличная работа!</p>
    <button class="btn-run" onclick="document.getElementById('completionModal').classList.remove('visible')">Отлично!</button>
  </div>
</div>

<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
//  TASK DEFINITIONS
// ═══════════════════════════════════════════════════════════
const TASKS = [
  {
    title: "Привет, мир!",
    description: `
      <p>Добро пожаловать в курс по основам Python! 🐍</p>
      <p>Любое обучение программированию начинается с классической задачи — вывести текст на экран. В Python для этого используется функция <code>print()</code>.</p>
      <pre>print("Текст для вывода")</pre>
      <p><strong>Задание:</strong> Напишите программу, которая выводит на экран фразу:</p>
      <div class="expected">
        <div class="expected-label">Ожидаемый вывод</div>
        Привет, мир!
      </div>
    `,
    starter: `# Напишите программу, которая выводит "Привет, мир!"\n`,
    check(stdout, code) {
      const out = stdout.trim();
      if (out === "Привет, мир!") return { pass: true };
      if (out === "") return { pass: false, hint: "Используйте функцию print() для вывода текста." };
      if (out.toLowerCase().includes("привет") && out.toLowerCase().includes("мир"))
        return { pass: false, hint: "Почти! Проверьте точное написание, включая запятую и восклицательный знак: Привет, мир!" };
      return { pass: false, hint: `Вывод должен быть точно "Привет, мир!", а получено "${out}".` };
    }
  },
  {
    title: "Переменные и присваивание",
    description: `
      <p>Переменная — это именованная область памяти для хранения данных. В Python переменные создаются в момент присваивания значения:</p>
      <pre>name = "Алиса"
age = 25
print(name)
print(age)</pre>
      <p><strong>Задание:</strong> Создайте переменную <code>city</code> со значением <code>"Москва"</code> и выведите её на экран.</p>
      <div class="expected">
        <div class="expected-label">Ожидаемый вывод</div>
        Москва
      </div>
    `,

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let currentTask = 0;
let completed = new Set();
let pyodide = null;
let isRunning = false;

// Load progress from localStorage
try {
  const saved = JSON.parse(localStorage.getItem('pycamp_progress') || '{}');
  if (saved.completed) completed = new Set(saved.completed);
  if (typeof saved.currentTask === 'number') currentTask = saved.currentTask;
} catch(e) {}

function saveProgress() {
  localStorage.setItem('pycamp_progress', JSON.stringify({
    completed: [...completed],
    currentTask
  }));
}

// ═══════════════════════════════════════════════════════════
//  PYODIDE INIT
// ═══════════════════════════════════════════════════════════
async function initPyodide() {
  const statusEl = document.getElementById('loadingStatus');
  try {
    statusEl.textContent = 'Загрузка Pyodide (~20 МБ)...';
    pyodide = await loadPyodide();
    statusEl.textContent = 'Готово!';
    setTimeout(() => {
      document.getElementById('loadingScreen').classList.add('hidden');
    }, 400);
  } catch(e) {
    statusEl.textContent = 'Ошибка загрузки. Обновите страницу.';
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════════════
//  UI RENDERING
// ═══════════════════════════════════════════════════════════
function renderTask() {
  const task = TASKS[currentTask];
  document.getElementById('taskNumber').textContent = `ЗАДАЧА ${currentTask + 1} ИЗ ${TASKS.length}`;
  document.getElementById('taskTitle').textContent = task.title;
  document.getElementById('taskDescription').innerHTML = task.description;
  document.getElementById('codeEditor').value = task.starter;
  updateLineNumbers();
  hideResults();
  updateProgress();
  updateNavButtons();
  renderTaskList();
  saveProgress();
}

function updateProgress() {
  const pct = Math.round((completed.size / TASKS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPercent').textContent = pct + '%';
  document.getElementById('progressLabel').textContent = `Задача ${currentTask + 1} из ${TASKS.length}`;
  document.getElementById('solvedCount').textContent = completed.size;
  document.getElementById('totalCount').textContent = TASKS.length;
}

function updateNavButtons() {
  document.getElementById('btnPrev').disabled = currentTask === 0;
  document.getElementById('btnNext').disabled = currentTask === TASKS.length - 1;
}

function renderTaskList() {
  const container = document.getElementById('taskListItems');
  container.innerHTML = TASKS.map((t, i) => `
    <div class="task-list-item ${i === currentTask ? 'active' : ''} ${completed.has(i) ? 'completed' : ''}"
         onclick="goToTask(${i})">
      <div class="task-check">${completed.has(i) ? '✓' : ''}</div>
      <span>${i + 1}. ${t.title}</span>
    </div>
  `).join('');
}

function hideResults() {
  document.getElementById('resultBanner').className = 'result-banner';
  document.getElementById('outputPanel').classList.remove('visible');
}

function showResult(type, icon, title, hint) {
  const banner = document.getElementById('resultBanner');
  banner.className = `result-banner visible ${type}`;
  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultText').innerHTML = `<strong>${title}</strong>${hint ? `<div class="hint">${hint}</div>` : ''}`;
}

function showOutput(text, type) {
  const panel = document.getElementById('outputPanel');
  const content = document.getElementById('outputContent');
  panel.classList.add('visible');
  content.className = `output-content ${type}`;
  content.textContent = text;
}

// ═══════════════════════════════════════════════════════════
//  LINE NUMBERS
// ═══════════════════════════════════════════════════════════
function updateLineNumbers() {
  const editor = document.getElementById('codeEditor');
  const lines = editor.value.split('\n').length;
  const container = document.getElementById('lineNumbers');
  container.innerHTML = Array.from({length: lines}, (_, i) => `<div>${i + 1}</div>`).join('');
}

document.getElementById('codeEditor').addEventListener('input', updateLineNumbers);
document.getElementById('codeEditor').addEventListener('scroll', function() {
  document.getElementById('lineNumbers').scrollTop = this.scrollTop;
});

// Tab support
document.getElementById('codeEditor').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 4;
    updateLineNumbers();
  }
  // Ctrl+Enter to run
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }
});

// ═══════════════════════════════════════════════════════════
//  CODE EXECUTION
// ═══════════════════════════════════════════════════════════
async function runCode() {
  if (isRunning || !pyodide) return;
  isRunning = true;

  const btn = document.getElementById('btnRun');
  btn.classList.add('loading');
  btn.disabled = true;
  hideResults();

  const code = document.getElementById('codeEditor').value;

  try {
    // Redirect stdout
    pyodide.runPython(`
import sys
from io import StringIO
sys.stdout = StringIO()
sys.stderr = StringIO()
`);

    // Run user code
    let error = null;
    try {
      pyodide.runPython(code);
    } catch(e) {
      error = e;
    }

    // Capture output
    const stdout = pyodide.runPython('sys.stdout.getvalue()');
    const stderr = pyodide.runPython('sys.stderr.getvalue()');

    // Reset
    pyodide.runPython(`
import sys
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);

    if (error) {
      const errMsg = error.message || String(error);
      // Extract line number
      let lineInfo = '';
      const lineMatch = errMsg.match(/line (\d+)/);
      if (lineMatch) {
        lineInfo = ` (строка ${lineMatch[1]})`;
      }

      showOutput(errMsg, 'error');

      // Determine hint based on error type
      let hint = '';
      if (errMsg.includes('SyntaxError')) {
        hint = 'Синтаксическая ошибка. Проверьте скобки, кавычки и двоеточия.';
      } else if (errMsg.includes('IndentationError')) {
        hint = 'Ошибка отступов. Используйте 4 пробела для вложенных блоков.';
      } else if (errMsg.includes('NameError')) {
        const nameMatch = errMsg.match(/name '(\w+)'/);
        hint = nameMatch
          ? `Переменная "${nameMatch[1]}" не определена. Проверьте написание.`
          : 'Использована неопределённая переменная.';
      } else if (errMsg.includes('TypeError')) {
        hint = 'Ошибка типов. Проверьте, что операции применяются к совместимым типам.';
      } else if (errMsg.includes('IndexError')) {
        hint = 'Индекс выходит за пределы. Проверьте длину списка/строки.';
      } else if (errMsg.includes('KeyError')) {
        hint = 'Такого ключа нет в словаре. Проверьте написание ключа.';
      } else {
        hint = 'Проверьте код и попробуйте ещё раз.';
      }

      showResult('error', '✗', `Ошибка${lineInfo}`, hint);
    } else {
      // Show stdout
      if (stdout.trim()) {
        showOutput(stdout.trimEnd(), 'info');
      }

      // Check answer
      const task = TASKS[currentTask];
      const result = task.check(stdout, code);

      if (result.pass) {
        completed.add(currentTask);
        saveProgress();
        updateProgress();
        renderTaskList();
        showResult('success', '✓', 'Отлично! Задача решена.',
          currentTask < TASKS.length - 1 ? 'Нажмите «Далее» для следующей задачи.' : 'Это была последняя задача! 🎉');

        if (completed.size === TASKS.length) {
          setTimeout(() => {
            document.getElementById('completionModal').classList.add('visible');
          }, 1000);
        }
      } else {
        showResult('warning', '⚠', 'Не совсем правильно', result.hint || 'Попробуйте ещё раз.');
      }
    }
  } catch(e) {
    showOutput(String(e), 'error');
    showResult('error', '✗', 'Ошибка выполнения', 'Проверьте код и попробуйте ещё раз.');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
    isRunning = false;
  }
}

// ═══════════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════════
function nextTask() {
  if (currentTask < TASKS.length - 1) {
    currentTask++;
    renderTask();
    document.getElementById('panelLeft').scrollTop = 0;
  }
}

function prevTask() {
  if (currentTask > 0) {
    currentTask--;
    renderTask();
    document.getElementById('panelLeft').scrollTop = 0;
  }
}

function goToTask(i) {
  currentTask = i;
  renderTask();
  document.getElementById('panelLeft').scrollTop = 0;
  toggleTaskList();
}

function resetCode() {
  if (confirm('Сбросить код к начальному состоянию?')) {
    document.getElementById('codeEditor').value = TASKS[currentTask].starter;
    updateLineNumbers();
    hideResults();
  }
}

function toggleTaskList() {
  const panel = document.getElementById('taskListPanel');
  const overlay = document.getElementById('taskListOverlay');
  const isOpen = panel.classList.contains('open');
  panel.classList.toggle('open');
  overlay.style.display = isOpen ? 'none' : 'block';
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
renderTask();
initPyodide();
</script>
